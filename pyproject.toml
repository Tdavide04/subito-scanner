[project]
name = "subito-scanner"
version = "0.1.0"
description = "Subito.it Marketplace adapter for Personal Collection Hub (public search API, read-only)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "pch-marketplace-kit>=0.1,<0.2",
]

[project.entry-points."pch.marketplaces"]
subito = "subito_scanner:create_adapter"

[tool.uv.sources]
pch-marketplace-kit = { git = "https://github.com/Tdavide04/pch-marketplace-kit", rev = "cb934d8b833097d2a20245ae150ccbdae4f82961" }

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
